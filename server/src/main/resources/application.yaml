spring:
  application:
    name: server
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  port: 8080

nasa:
  api-key: ${API_KEY}
  base-url: https://api.nasa.gov
